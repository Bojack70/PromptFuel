name: Max Post to Bluesky

on:
  workflow_dispatch:
    inputs:
      post_text:
        description: 'Post text (max 300 chars)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Max
        run: pnpm --filter @promptfuel/max build

      - name: Post to Bluesky
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Bojack70
          GITHUB_REPO: PromptFuel
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          POST_TEXT: ${{ inputs.post_text }}
          MAX_DATA_DIR: packages/max/data
        run: node packages/max/dist/index.js --mode post

      - name: Commit content log
        run: |
          git config user.name "Max Agent"
          git config user.email "max@promptfuel.dev"
          git add packages/max/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: manual bluesky post $(date -u +%Y-%m-%d)"
            git push
          fi
