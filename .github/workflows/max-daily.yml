name: Max Daily Collection

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write          # Needed to commit snapshots

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Max
        run: pnpm --filter @promptfuel/max build

      - name: Run daily reader (fetch articles to corpus)
        env:
          MAX_DATA_DIR: packages/max/data
        run: node packages/max/dist/index.js --mode read-daily
        continue-on-error: true

      - name: Fetch daily trends (HN top stories)
        env:
          MAX_DATA_DIR: packages/max/data
        run: node packages/max/dist/index.js --mode fetch-trends
        continue-on-error: true

      - name: Run daily collection + content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Bojack70
          GITHUB_REPO: PromptFuel
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MAX_DATA_DIR: packages/max/data
        run: node packages/max/dist/index.js --mode daily

      # Refresh dashboard HTML so the Today's Actions card reflects today's
      # state (which manual items to run, which commands, current day).
      # Otherwise the dashboard would only regenerate on Monday's weekly pass.
      - name: Regenerate dashboard
        env:
          MAX_DATA_DIR: packages/max/data
        run: node packages/max/dist/index.js --mode dashboard
        continue-on-error: true

      - name: Commit snapshots
        run: |
          git config user.name "Max Agent"
          git config user.email "max@promptfuel.dev"
          git add packages/max/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
